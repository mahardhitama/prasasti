[package]
name = "prasasti"
version = "0.1.0"
edition = "2024"

[[test]]
name = "app"
harness = false

[dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSDocument", "NSTextView", "NSWindowController", "NSMenu", "NSMenuItem", "NSApplication", "NSScrollView", "NSTextStorage", "NSLayoutManager", "NSTextContainer", "NSResponder", "NSView", "NSWindow", "NSText", "NSRunningApplication", "NSGraphics", "NSFontPanel", "NSUserInterfaceValidation", "NSPrintInfo", "NSPrintOperation", "NSColorSpace", "NSFontManager", "NSTextCheckingClient", "NSTextInputClient", "NSDragging", "NSAttributedString", "NSDocumentController", "NSWindowRestoration", "NSColor", "objc2-core-foundation", "NSEvent", "NSFont", "NSAppearance", "NSFontDescriptor", "NSGraphicsContext", "NSPasteboard", "NSPasteboardItem", "objc2-core-graphics", "NSStackView", "NSSearchField", "NSTextField", "NSControl", "NSButton", "NSLayoutConstraint", "NSUserInterfaceLayout", "NSCell", "NSActionCell", "NSButtonCell", "NSTextFieldCell", "NSSearchFieldCell", "NSPanel", "NSAlert", "block2"] }
objc2-foundation = "0.3.2"
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }
prasasti-core = { version = "0.1.0", path = "../prasasti-core" }
